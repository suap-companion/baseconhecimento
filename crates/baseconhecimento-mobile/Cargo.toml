[package]
name = "baseconhecimento-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib: a biblioteca que o Android carrega; lib: para os testes e para o gerador de ligações.
crate-type = ["cdylib", "lib"]
name = "baseconhecimento_mobile"

[features]
# Só para gerar as ligações; não entra na biblioteca do aplicativo.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
baseconhecimento-core = { path = "../baseconhecimento-core" }
suap-core.workspace = true
# Ligações Kotlin geradas a partir do código Rust (a fachada do app).
uniffi = "0.29"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
