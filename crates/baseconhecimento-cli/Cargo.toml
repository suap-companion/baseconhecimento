[package]
name = "baseconhecimento-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "baseconhecimento"
path = "src/main.rs"

[dependencies]
baseconhecimento-core = { path = "../baseconhecimento-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
suap-core.workspace = true

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
